name: auto
on:
  schedule: [{cron: "0 6 * * *"}]   # cada día a las 6:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python modulo1_motor.py
      - run: |
          git config user.name bot && git config user.email bot@x.com
          git add -A && git commit -m "update" || true
          git push
